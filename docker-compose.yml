services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: avaliacoes
      POSTGRES_USER: avaliacoes
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avaliacoes -d avaliacoes"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/avaliacoes
      DB_USER: avaliacoes
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@escola.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  postgres_data:

