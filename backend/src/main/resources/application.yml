spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/avaliacoes}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jackson:
    time-zone: UTC
server:
  forward-headers-strategy: framework
  error:
    include-message: never
app:
  jwt-issuer: avaliacoes
  jwt-secret: ${JWT_SECRET:postgrespostgrespostgrespostgres}
  origin: ${APP_ORIGIN:http://localhost:4200}
  admin-email: ${ADMIN_EMAIL:admin@escola.local}
  admin-password: ${ADMIN_PASSWORD:aA@123456789}
management:
  endpoints:
    web:
      exposure:
        include: health
